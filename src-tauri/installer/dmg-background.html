<!doctype html>
<!--
  Background of the macOS installer window (the DMG). scripts/installer-images.sh
  renders it at 1x and 2x into dmg-background.tiff. Finder lays the icons on top:
  the app at (180, 226) and Applications at (500, 226), the centres of their
  128 px icons (bundle.macOS.dmg in tauri.conf.json). Finder writes the icon
  names in black, even in dark mode: keep the background light under them.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Cabinet Grotesk"; src: url("../../src/assets/fonts/CabinetGrotesk.ttf"); font-weight: 100 900; }
  html, body { margin: 0; width: 680px; height: 448px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(46% 52% at 50% 0%, rgba(107, 82, 240, 0.16), rgba(107, 82, 240, 0) 72%),
      radial-gradient(30% 40% at 4% 100%, rgba(255, 168, 120, 0.16), rgba(255, 168, 120, 0) 72%),
      radial-gradient(30% 40% at 96% 100%, rgba(124, 106, 240, 0.14), rgba(124, 106, 240, 0) 72%),
      #f7f6fc;
    font-family: "Cabinet Grotesk", -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .logo { position: absolute; top: 34px; left: 0; right: 0; display: flex; justify-content: center; align-items: baseline; gap: 8px; }
  .logo svg { height: 25px; width: auto; transform: translateY(3px); }
  .logo span { color: #5840f0; font-size: 21px; font-weight: 500; letter-spacing: -0.01em; }
  .tagline { position: absolute; top: 72px; left: 0; right: 0; text-align: center; color: #6e6a85; font-size: 13px; letter-spacing: 0.01em; }

  .spot { position: absolute; width: 210px; height: 210px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,255,255,0.95), rgba(255,255,255,0.6) 55%, rgba(255,255,255,0) 100%); }

  .photo { position: absolute; padding: 4px; background: #fff; border-radius: 7px;
    box-shadow: 0 1px 2px rgba(25, 18, 70, 0.10), 0 12px 28px -6px rgba(25, 18, 70, 0.22); }
  .photo img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
  .photo.out img { filter: saturate(0.5) brightness(0.92); }
  .badge { position: absolute; right: -7px; top: -7px; width: 20px; height: 20px; border-radius: 50%;
    display: grid; place-items: center; box-shadow: 0 2px 6px rgba(25, 18, 70, 0.25), 0 0 0 2px #fff; }
  .badge svg { width: 11px; height: 11px; }
  .keep { background: #34c759; }
  .reject { background: #ff5a4e; }
  .star { background: #ffb020; }

  .arrow { position: absolute; left: 282px; top: 178px; width: 116px; height: 52px; }
  .hint { position: absolute; top: 246px; left: 240px; width: 200px; text-align: center; color: #5840f0; font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
  .foot { position: absolute; top: 386px; left: 0; right: 0; text-align: center; color: #8a86a0; font-size: 12px; letter-spacing: 0.02em; }
  .foot b { color: #46425e; font-weight: 600; }
  .foot i { font-style: normal; color: #c4c0d8; padding: 0 7px; }
</style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 89 31" xmlns="http://www.w3.org/2000/svg" fill="#15122b"><path d="M28.171 10.2662C28.171 16.2247 22.6109 19.687 12.7264 19.7675V29.9532H16.4331V30.5974H0.370671V29.9532H3.66553V3.78442L0 1.61039H13.3853C23.517 1.61039 28.171 5.27403 28.171 10.2662ZM13.1794 2.25455H12.7264V19.1234C16.3095 19.0831 18.6983 15.7818 18.6983 10.3065C18.6983 5.03247 16.4743 2.25455 13.1794 2.25455Z"/><path d="M47.2319 26.9338L47.2731 26.974C45.5433 29.5507 42.7839 31 38.9536 31C33.1464 31 28.3689 27.0545 28.3689 20.8143C28.3689 14.9364 32.4051 10.0649 38.9948 10.0649C42.8663 10.0649 45.5433 12.2792 45.5433 15.2182C45.5433 18.5597 42.9074 21.4987 37.9652 23.3104C40.3127 25.5649 43.2781 27.0545 46.0376 27.0545C46.4494 27.0545 46.8613 27.0143 47.2319 26.9338ZM35.1645 11.474C34.0937 11.474 33.4759 12.3597 33.4759 13.8494C33.4759 17.1909 35.2469 20.5727 37.718 23.0688C38.8712 21.6195 39.3243 20.0091 39.3243 17.9558C39.3243 14.4532 36.9355 11.474 35.1645 11.474Z"/><path d="M48.4636 30.5974V29.9532H50.5229V5.9987L48.1753 4.02597L58.7601 0.402597V29.9532H60.8194V30.5974H48.4636Z"/><path d="M62.3397 30.5974V29.9532H64.399V5.9987L62.0514 4.02597L72.6361 0.402597V29.9532H74.6954V30.5974H62.3397Z"/><path d="M82.3936 8.97792C79.4694 8.97792 77.822 7.16623 77.822 4.46883C77.822 1.81169 79.4694 0 82.3936 0C85.3178 0 86.9652 1.81169 86.9652 4.46883C86.9652 7.16623 85.3178 8.97792 82.3936 8.97792ZM76.2157 30.5974V29.9532H78.275V15.2584L75.9274 13.2857L86.5121 9.66234V29.9532H88.5714V30.5974H76.2157Z"/></svg>
    <span>Instant</span>
  </div>
  <div class="tagline">AI photo culling, on your Mac</div>

  <div class="photo" style="left: 612px; top: 176px; width: 86px; height: 112px; transform: rotate(-5deg)">

  </div>
  <div class="photo" style="left: 532px; top: 328px; width: 108px; height: 76px; transform: rotate(4deg)">

  </div>

  <div class="spot" style="left: 75px; top: 121px"></div>
  <div class="spot" style="left: 395px; top: 121px"></div>

  <svg class="arrow" viewBox="0 0 116 52" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
        <path d="M1 1 L8 5 L1 9" stroke="#5840f0" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <path d="M8 38 C 34 12, 80 12, 106 36" stroke="#5840f0" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#head)"/>
    <circle cx="8" cy="38" r="3" fill="#5840f0"/>

  <div class="hint">Drag to Applications</div>

  <div class="foot"><b>Free</b><i>·</i><b>Unlimited</b><i>·</i><b>Open source</b></div>
</body>
</html>
